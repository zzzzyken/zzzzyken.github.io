    Projects:
      - name: Deep Learning-Based Method for Visual Servoing
        date: 2024 – 2025
        summary: "Undergraduate thesis, Huazhong University of Science and Technology, December 2024 to May 2025. Advisor: Ke Xian"
        highlights:
          - Integrated DINOv2 as a visual feature extractor in an end-to-end visual servoing method.
          - Developed a hybrid servo policy combining end-to-end and observer-controller methods to address challenging visual servoing scenarios.

      - name: Cross-Time Scale Pig Face Recognition
        date: 2023 – 2024
        summary: "Project leader, College Students' Innovation and Entrepreneurship Training Program, May 2023 to February 2024. Advisor: Prof. Xinggang Wang"
        highlights:
          - Used YOLOv8 for pig face detection and Transformer-based representations for individual recognition.
          - Explored ViT modifications to improve recognition accuracy and robustness across time.

      - name: Mobile Screen Defect Detection and Localization
        date: 2024
        summary: March to May 2024
        highlights:
          - Built an OpenCV pipeline for region localization in ultra-high-resolution images, background texture suppression, image enhancement, and adaptive threshold segmentation for defect detection.

