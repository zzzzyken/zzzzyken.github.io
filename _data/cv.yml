    Experience:
      - company: Vanderbilt University, Medical Image Analysis
        position: "Research: Domain Generalization in Diabetic Retinopathy Grading"
        location: Nashville, TN, USA
        date: Jul – Nov 2026
        summary: "Advisors: Prof. Yuankai Huo and Prof. He Zhao"
        highlights:
          - Developed a dual-scale lesion and background prototype framework using severity labels alone, combining competitive assignment with severity-guided multiple instance learning.
          - Designed a 19-parameter additive ordinal grading head driven exclusively by 14 lesion prototype presence scores, with teacher guided degradation consistency and spatial shortcut regularization.
          - Achieved mean quadratic weighted kappa (QWK) of 0.761 across six held-out domains in leave-one-domain-out evaluation, surpassing the strongest evaluated baseline by 0.036 (three seeds).
          - Validated lesion localization and decision contributions through prototype removal; improved grading in five existing prototype architectures by transferring the supervision strategy.

      - company: Vanderbilt University, Medical Image Analysis
        position: "Research: Pathology and Anatomy Guided DR Grading (PARAGraph)"
        location: Nashville, TN, USA
        date: Jan – Jun 2026
        summary: "Advisors: Prof. Yuankai Huo and Prof. He Zhao"
        highlights:
          - Developed a hierarchical graph that integrates retinal anatomy, lesion regions, and image-level context using optic disc anchored polar coordinates and graph attention.
          - Designed a dual-confidence gating mechanism to reduce sensitivity to imperfect lesion segmentation and evaluated grading across multiple retinal datasets.

      - company: Vanderbilt University, Dept. of Electrical and Computer Engineering
        position: Teaching Assistant / Grader
        location: Nashville, TN, USA
        date: 2025 – 2026
        highlights:
          - "Deep Learning (Fall 2026): held office hours and supported students with course questions and assignments."
          - "Image Processing (ECE 4353) and ECE 2112: graded coursework."

      - company: Shenzhen Institute of Artificial Intelligence and Robotics for Society
        position: Research Intern
        location: Shenzhen, China
        date: 2024 – 2025
        summary: August 2024 to March 2025
        highlights:
          - Implemented data augmentation for YOLO-based pipeline defect detection and updated JSON annotation metadata.
          - Investigated geometric perception in large multimodal models through visual encoder analysis; designed evaluation protocols and datasets and conducted model testing.

